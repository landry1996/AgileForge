name: AgileForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agileforge_test
          POSTGRES_USER: agileforge
          POSTGRES_PASSWORD: agileforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build & Test
        working-directory: agileforge-backend
        run: mvn clean verify -B
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agileforge_test
          SPRING_DATASOURCE_USERNAME: agileforge
          SPRING_DATASOURCE_PASSWORD: agileforge_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: agileforge-backend/target/surefire-reports/

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agileforge-frontend/package-lock.json

      - name: Install dependencies
        working-directory: agileforge-frontend
        run: npm ci

      - name: Build
        working-directory: agileforge-frontend
        run: npx ng build --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: agileforge-frontend/dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build backend JAR
        working-directory: agileforge-backend
        run: mvn clean package -B -DskipTests

      - name: Build Docker images
        run: docker compose build

      - name: Verify images
        run: docker images | grep agileforge
