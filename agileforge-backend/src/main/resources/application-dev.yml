spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agileforge_dev
    username: agileforge
    password: ${DB_PASSWORD:agileforge_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    clean-disabled: false

# Logging
logging:
  level:
    com.agileforge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev-specific overrides
agileforge:
  security:
    cors:
      allowed-origins: http://localhost:4200,http://localhost:3000
