spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/agileforge_prod}
    username: ${SPRING_DATASOURCE_USERNAME:agileforge}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms

  flyway:
    clean-disabled: true

# Logging production
logging:
  level:
    root: WARN
    com.agileforge: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator (restreindre en prod)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# Swagger désactivé en production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Application
agileforge:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://agileforge.example.com}
