spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///agileforge_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6380

  flyway:
    clean-disabled: false

logging:
  level:
    com.agileforge: INFO
    org.springframework.security: WARN

agileforge:
  security:
    jwt:
      secret-key: dGVzdC1zZWNyZXQta2V5LWZvci1hZ2lsZWZvcmdlLXRlc3RpbmctcHVycG9zZXMtb25seQ==
      access-token-expiration: 900000
      refresh-token-expiration: 3600000
