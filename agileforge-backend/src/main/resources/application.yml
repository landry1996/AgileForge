spring:
  application:
    name: agileforge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Server
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Application custom properties
agileforge:
  storage:
    path: ${AGILEFORGE_STORAGE_PATH:./uploads}
  security:
    jwt:
      access-token-expiration: 900000       # 15 minutes
      refresh-token-expiration: 604800000   # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  pagination:
    default-page-size: 20
    max-page-size: 100
  ai:
    api-key: ${CLAUDE_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-4-20250514}
    max-tokens: 4096
    rate-limit-per-minute: 30
  oauth2:
    enabled: ${OAUTH2_ENABLED:false}
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/agileforge}
    client-id: ${OAUTH2_CLIENT_ID:agileforge-api}
