# === Configuration initiale (AVANT d'avoir le certificat SSL) ===
# Utiliser ce fichier lors du PREMIER déploiement pour obtenir le certificat.
# Une fois le certificat obtenu, remplacer par agileforge.conf
#
# Procédure :
# 1. Renommer agileforge.conf → agileforge-ssl.conf (temporairement)
# 2. Renommer ce fichier → agileforge.conf
# 3. Lancer : docker compose -f docker-compose.prod.yml up -d nginx-proxy
# 4. Générer le certificat (voir script init-ssl.sh)
# 5. Remettre agileforge-ssl.conf → agileforge.conf
# 6. Relancer : docker compose -f docker-compose.prod.yml restart nginx-proxy

server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Servir le frontend directement en HTTP (temporaire)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API en HTTP (temporaire)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
